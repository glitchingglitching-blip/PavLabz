plugins { id 'com.android.application' }
android {
    namespace 'dev.offline.obbinstaller'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.offline.obbinstaller'
        minSdk 29
        targetSdk 35
        testInstrumentationRunner "dev.offline.obbinstaller.PositioningInstrumentation"
        versionCode 23
        versionName '0.22'
    }
    buildTypes { debug { debuggable false }; release { minifyEnabled false; debuggable false } }
    androidResources { noCompress += ['obb'] }
}

dependencies { implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'; implementation 'org.conscrypt:conscrypt-android:2.5.3'; implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81' }
